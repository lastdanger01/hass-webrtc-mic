create_link:
  fields:
    link_id:
      example: fd0a53ca-e9ab-4e7a-86a2-441642b16ae1
      required: true
      selector:
        text:
    url:
      example: rtsp://rtsp:12345678@192.168.1.123:554/av_stream/ch0
      selector:
        text:
    entity:
      example: camera.generic_stream
      selector:
        entity:
          domain: camera
    open_limit:
      default: 1
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: times
    time_to_live:
      default: 60
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: seconds

dash_cast:
  fields:
    entity_id:
      example: media_player.mibox4
      required: true
      selector:
        entity:
          integration: cast
          domain: media_player
    url:
      example: rtsp://rtsp:12345678@192.168.1.123:554/av_stream/ch0
      selector:
        text:
    entity:
      example: camera.generic_stream
      selector:
        entity:
          domain: camera
    extra:
      selector:
        object:
    force:
      selector:
        boolean:
    hass_url:
      example: http://192.168.1.123:8123
      selector:
        text:

play_media:
  fields:
    stream:
      example: kitchen225
      required: true
      selector:
        text:
    media_content_id:
      example: media-source://media_source/local/song.mp3
      required: true
      selector:
        text:
    title:
      example: Song Title
      selector:
        text:
    source_id:
      example: media-source://media_source/local/song.mp3
      selector:
        text:
      description: >-
        The original media id of the track. The resolved URL is signed and
        changes on every resolve, so this is what tells the integration that
        the same track is requested again and must not be restarted.
    audio:
      default: pcma
      selector:
        text:

stop_media:
  fields:
    stream:
      example: kitchen225
      required: true
      selector:
        text:

reload_card:
  fields: {}
  description: >-
    Register the card module with the Lovelace frontend again. Use this when
    the card shows "Custom element doesn't exist: webrtc-mic-camera". Reload
    the browser after calling it.
